<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 500px;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🚀 CI/CD Demo</h1>

        <p>
            This website was automatically deployed using
            GitHub Actions and GitHub Pages.
        </p>

        <div class="badge">
            ✅ Deployment Successful
        </div>
    </div>
</body>
</html>
